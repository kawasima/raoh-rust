[package]
name = "raoh"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Decoders that turn untyped JSON into typed domain values, reporting every issue with its path"
repository = "https://github.com/kawasima/raoh-rust"
readme = "README.md"
keywords = ["decoder", "validation", "json", "parse", "domain"]
categories = ["parsing", "encoding"]
exclude = [".github/", "scripts/"]

[dependencies]
serde = "1"
serde_json = "1"
indexmap = "2"
regex = { version = "1", optional = true }
rust_decimal = { version = "1", optional = true }
uuid = { version = "1", optional = true }
url = { version = "2", optional = true }

[features]
regex = ["dep:regex"]
decimal = ["dep:rust_decimal"]
uuid = ["dep:uuid"]
url = ["dep:url"]

[dev-dependencies]
proptest = "1"
# Reports members in input order, as Raoh for Java does, so tests/compat.rs can compare them.
serde_json = { version = "1", features = ["preserve_order"] }
trybuild = "1"

[package.metadata.docs.rs]
all-features = true
